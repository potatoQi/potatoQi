name: Update project cards

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/update-project-cards.yml

permissions:
  contents: write

concurrency:
  group: update-project-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install text measurement dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-liberation
      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_cards.py
      - name: Commit refreshed cards
        run: |
          git add assets/cards
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh project cards'
          git push
